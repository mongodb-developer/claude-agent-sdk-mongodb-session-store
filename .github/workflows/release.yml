name: Release

on:
  release:
    types: [published]
  # Manual runs are dry runs: test and build only, never publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: $/.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag matches the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match project version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      # Same twine as gh-action-pypi-publish v1.14.2, which reads metadata 2.5.
      - name: Check distributions
        run: uvx twine==7.0.0 check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  test-wheel:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No cache, so a dependency missing from the package metadata can't be
      # masked by one left over from an earlier run.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "9.0"

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Remove the source so only the wheel can be imported
        run: rm -r claude_agent_sdk_mongodb_session_store

      - name: Import the wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env" dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -I -c "import claude_agent_sdk_mongodb_session_store"

      - name: Run the tests against the wheel
        run: |
          uv sync --locked --no-install-project
          uv pip install --python .venv dist/*.whl
          uv run --no-sync pytest

  publish:
    needs: [build, test-wheel]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
