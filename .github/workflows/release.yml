name: Release

on:
  release:
    types: [published]
  # Manual runs are dry runs: test, build, and sign, but never publish or
  # attach anything to a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: $/.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag matches the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match project version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      # Same twine as gh-action-pypi-publish v1.14.2, which reads metadata 2.5.
      - name: Check distributions
        run: uvx twine==7.0.0 check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  test-wheel:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No cache, so a dependency missing from the package metadata can't be
      # masked by one left over from an earlier run.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Start MongoDB
        id: mongodb
        uses: mongodb-labs/drivers-evergreen-tools@ec0b1497b3d351acbfc4fd7579bf3de4de0a1046 # v1.1.0
        with:
          version: "9.0"

      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Remove the source so only the wheel can be imported
        run: rm -r claude_agent_sdk_mongodb_session_store

      - name: Import the wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env" dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -I -c "import claude_agent_sdk_mongodb_session_store"

      - name: Run the tests against the wheel
        env:
          MONGODB_URI: ${{ steps.mongodb.outputs.cluster-uri }}
        run: |
          uv sync --locked --no-install-project
          uv pip install --python .venv dist/*.whl
          uv run --no-sync pytest

  sign:
    name: Sign distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      id-token: write # required to assume the AWS signing role
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up signing credentials
        uses: $/.github/actions/release-setup
        with:
          aws_role_arn: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_SIGNING_REGION }}
          aws_secret_id: ${{ secrets.AWS_SIGNING_SECRET_ID }}

      - name: Sign distributions
        uses: $/.github/actions/sign-artifacts
        with:
          path: dist/

      - name: Upload signatures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-signatures
          path: dist/*.sig
          if-no-files-found: error

  publish:
    needs: [build, test-wheel, sign]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-signatures:
    name: Attach signatures to the release
    needs: [sign, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # required to upload release assets
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download signatures
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist-signatures
          path: dist/

      - name: Checksum the signed distributions
        run: (cd dist && sha256sum -- *.whl *.tar.gz *.sig > SHA256SUMS)

      - name: Upload distributions, signatures, and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so gh can't infer it
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # --clobber lets a rerun replace assets left by a partially failed upload.
        run: gh release upload --clobber "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.sig dist/SHA256SUMS
