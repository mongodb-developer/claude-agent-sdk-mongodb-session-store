repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock

  # Run mypy inside the project environment (not an isolated hook env) so it
  # sees the installed claude-agent-sdk and pymongo type information.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy claude_agent_sdk_mongodb_session_store/ tests/
        language: system
        types: [python]
        pass_filenames: false
